name: XP Compatibility Test

on:
  workflow_dispatch:
  push:
    paths:
      - "src/runtime/os_windows.go"
      - "src/runtime/signal_windows.go"
      - "src/runtime/netpoll_windows.go"
      - "src/cmd/link/internal/ld/pe.go"
      - "src/cmd/vendor/golang.org/x/sys/windows/zsyscall_windows.go"
      - "src/internal/runtime/syscall/windows/**"
      - "src/internal/syscall/windows/**"
      - "src/syscall/zsyscall_windows.go"
      - "src/net/fd_windows.go"
      - "src/os/dir_windows.go"
      - "src/os/file_windows.go"
      - "src/os/types_windows.go"
      - "patches/0010-Add-Windows-XP-support.patch"
      - "testdata/xp-smoke/**"
      - "docker/xp/**"
      - "scripts/check-xp-pe.sh"
      - "scripts/fetch-xp-iso.sh"
      - "scripts/test-xp-docker.sh"
      - "scripts/xp-files.list"
      - "scripts/scaffold-version.sh"
      - "scripts/regenerate-xp-patch.sh"
      - ".github/workflows/xp-test.yml"
  pull_request:
    paths:
      - "src/runtime/os_windows.go"
      - "src/runtime/signal_windows.go"
      - "src/runtime/netpoll_windows.go"
      - "src/cmd/link/internal/ld/pe.go"
      - "src/cmd/vendor/golang.org/x/sys/windows/zsyscall_windows.go"
      - "src/internal/runtime/syscall/windows/**"
      - "src/internal/syscall/windows/**"
      - "src/syscall/zsyscall_windows.go"
      - "src/net/fd_windows.go"
      - "src/os/dir_windows.go"
      - "src/os/file_windows.go"
      - "src/os/types_windows.go"
      - "patches/0010-Add-Windows-XP-support.patch"
      - "testdata/xp-smoke/**"
      - "docker/xp/**"
      - "scripts/check-xp-pe.sh"
      - "scripts/fetch-xp-iso.sh"
      - "scripts/test-xp-docker.sh"
      - "scripts/xp-files.list"
      - "scripts/scaffold-version.sh"
      - "scripts/regenerate-xp-patch.sh"
      - ".github/workflows/xp-test.yml"


permissions:
  contents: read

jobs:
  pe-check:
    runs-on: ubuntu-latest
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up bootstrap Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: src/go.mod
          cache: false

      - name: Build toolchain
        working-directory: src
        env:
          CGO_ENABLED: "0"
        run: ./make.bash

      - name: PE and import checks
        run: ./scripts/check-xp-pe.sh

  xp-docker:
    needs: pe-check
    runs-on: ubuntu-latest
    # Nested KVM is usually unavailable on GitHub-hosted runners.
    # This job no-ops there and is meant for self-hosted runners with /dev/kvm
    # or local use of scripts/test-xp-docker.sh.
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Check KVM
        id: kvm
        run: |
          if [[ -e /dev/kvm ]]; then
            echo "available=true" >> "$GITHUB_OUTPUT"
            ls -l /dev/kvm
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo "No /dev/kvm on this runner. Skipping live XP Docker test."
            echo "Run locally: ./scripts/test-xp-docker.sh"
          fi

      - name: Set up bootstrap Go
        if: steps.kvm.outputs.available == 'true'
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: src/go.mod
          cache: false

      - name: Build toolchain
        if: steps.kvm.outputs.available == 'true'
        working-directory: src
        env:
          CGO_ENABLED: "0"
        run: ./make.bash

      - name: Cache XP ISO
        if: steps.kvm.outputs.available == 'true'
        uses: actions/cache@v6
        with:
          path: docker/xp/iso/xp-sp3.iso
          key: xp-iso-sp3-v1

      - name: Cache XP disk image
        if: steps.kvm.outputs.available == 'true'
        uses: actions/cache@v6
        with:
          path: docker/xp/storage
          key: xp-disk-${{ runner.os }}-dockur-6.04-v3

      - name: Validate XP storage cache
        if: steps.kvm.outputs.available == 'true'
        run: |
          storage="docker/xp/storage"
          if [[ -L "$storage" ]]; then
            storage="$(readlink -f "$storage")"
          fi
          if compgen -G "$storage/data.*" >/dev/null || [[ -f "$storage/windows.img" ]]; then
            if [[ ! -f "$storage/windows.boot" ]]; then
              echo "removing incomplete XP disk cache"
              find "$storage" -mindepth 1 -maxdepth 1 -exec rm -rf {} +
            fi
          fi

      - name: Run XP Docker smoke test
        if: steps.kvm.outputs.available == 'true'
        env:
          XP_TEST_TIMEOUT: "7200"
        run: ./scripts/test-xp-docker.sh

      - name: Upload XP smoke artifacts
        if: failure() && steps.kvm.outputs.available == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: xp-smoke-artifacts
          path: |
            docker/xp/shared/result.txt
            docker/xp/shared/smoke.out
            docker/xp/shared/smoke.exit
            docker/xp/shared/smoke.log
            docker/xp/shared/smoke-report.txt
          if-no-files-found: ignore
