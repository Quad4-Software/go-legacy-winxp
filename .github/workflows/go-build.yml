name: Go Build Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Release version (e.g. 1.23.4-2)"
        required: true
        type: string


permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    strategy:
      matrix:
        target:
          - windows_amd64
          - windows_arm64
          - windows_386
          - darwin_amd64
          - darwin_arm64
          - linux_amd64
          - linux_arm64
          - linux_arm
          - linux_386
        variant: [standard]
        include:
          - target: windows_amd64
            variant: race

    steps:
      - name: Harden runner
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit
      - name: Resolve source branch
        id: branch
        run: |
          VERSION="${{ inputs.version }}"
          MAJOR_MINOR=$(echo "$VERSION" | grep -oP '^\d+\.\d+')

          BRANCHES=$(git ls-remote --heads https://github.com/${{ github.repository }} | awk '{print $2}' | sed 's|refs/heads/||')

          RELEASE_BRANCH="release-branch.go${MAJOR_MINOR}"

          if echo "$BRANCHES" | grep -qx "$RELEASE_BRANCH"; then
            echo "branch=$RELEASE_BRANCH" >> $GITHUB_OUTPUT
            echo "Checking out $RELEASE_BRANCH for version $VERSION"
          else
            echo "branch=master" >> $GITHUB_OUTPUT
            echo "No release branch found for $MAJOR_MINOR, falling back to master"
          fi

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          path: go-legacy-winxp
          ref: ${{ steps.branch.outputs.branch }}
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: "go-legacy-winxp/src/go.mod"
          cache: false

      - name: Revert race detector patches
        if: matrix.variant == 'race'
        run: |
          cd go-legacy-winxp
          git apply -R patches/0008-Replace-atomic-Or-with-compare-and-swap-loop.patch
          git apply -R patches/0007-Drop-public-And-Or-ops-and-race-instrumentation.patch

      - name: Set execute permissions
        run: |
          chmod +x go-legacy-winxp/src/make.bash

      - name: Build Go toolchain
        env:
          GOOS: ${{ startsWith(matrix.target, 'windows_') && 'windows' || startsWith(matrix.target, 'darwin_') && 'darwin' || 'linux' }}
          GOARCH: ${{ endsWith(matrix.target, '_386') && '386' || endsWith(matrix.target, '_amd64') && 'amd64' || endsWith(matrix.target, '_arm64') && 'arm64' || 'arm' }}
          CGO_ENABLED: 0
        run: |
          cd go-legacy-winxp/src
          ./make.bash

      - name: Create release directory
        run: |
          mkdir -p release
          cp -r go-legacy-winxp release/
          cd release/go-legacy-winxp

          # Remove development files
          rm -rf .git*
          rm -rf codereview.cfg
          rm -rf patches
          rm -rf test
          rm -rf src/**/*_test.go
          rm -rf src/**/testdata
          rm -rf doc
          rm -rf misc
          rm -rf src/*.bash
          rm -rf src/*.bat
          rm -rf src/*.rc
          rm -rf src/make.*
          rm -rf src/run.*
          rm -rf *.md

          # Process binaries
          cd bin
          if [ "${{ matrix.target }}" != "linux_amd64" ]; then
            rm -f go gofmt
          fi
          if [ -d "${{ matrix.target }}" ]; then
            mv ${{ matrix.target }}/* ./
          fi
          rm -rf */

          # Clean up pkg folder
          cd ../pkg
          find . -mindepth 1 -maxdepth 1 -type d ! \( -name "include" -o -name "tool" \) -exec rm -rf {} +

          # Clean up pkg/tool folder
          cd tool
          find . -mindepth 1 -maxdepth 1 -type d ! -name "${{ matrix.target }}" -exec rm -rf {} +

      - name: Set version suffix
        id: version
        run: |
          if [ "${{ matrix.variant }}" == "race" ]; then
            echo "suffix=-race" >> $GITHUB_OUTPUT
          else
            echo "suffix=" >> $GITHUB_OUTPUT
          fi

      - name: Package
        run: |
          cd release
          if [[ "${{ matrix.target }}" == windows_* ]]; then
            zip -r ../go-legacy-winxp-${{ inputs.version }}${{ steps.version.outputs.suffix }}.${{ matrix.target }}.zip .
          else
            tar -czf ../go-legacy-winxp-${{ inputs.version }}${{ steps.version.outputs.suffix }}.${{ matrix.target }}.tar.gz .
          fi

      - name: Create Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cd go-legacy-winxp

          git config --global user.email "actions@github.com"
          git config --global user.name "GitHub Actions"

          git fetch --tags
          if ! git rev-parse "v${{ inputs.version }}" >/dev/null 2>&1; then
            git tag -a "v${{ inputs.version }}" -m "go-legacy-winxp-${{ inputs.version }}"
            git push origin "v${{ inputs.version }}"
          fi

          gh release view v${{ inputs.version }} || \
          gh release create v${{ inputs.version }} \
            --title "go-legacy-winxp-${{ inputs.version }}" \
            --notes "go-legacy-winxp-${{ inputs.version }}" \
            --draft \
            --target ${{ steps.branch.outputs.branch }}   # <-- dynamic branch

          gh release upload v${{ inputs.version }} \
            ../go-legacy-winxp-${{ inputs.version }}${{ steps.version.outputs.suffix }}.${{ matrix.target }}.* \
            --clobber
