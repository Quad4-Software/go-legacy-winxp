name: Go Build Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Release version without v prefix (empty uses VERSION, e.g. 1.27.1)"
        required: false
        type: string
        default: ""

permissions:
  contents: read

jobs:
  host:
    name: Build host toolchain
    runs-on: ubuntu-latest
    timeout-minutes: 60
    outputs:
      version: ${{ steps.meta.outputs.version }}
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Resolve version
        id: meta
        run: |
          set -euo pipefail
          input="${{ inputs.version }}"
          if [[ -n "$input" ]]; then
            ver="$input"
          else
            ver="$(head -n1 VERSION | tr -d '[:space:]')"
            ver="${ver#go}"
          fi
          ver="${ver#v}"
          if [[ ! "$ver" =~ ^[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z]+)*$ ]]; then
            echo "refusing version $ver" >&2
            exit 1
          fi
          echo "version=$ver" >> "$GITHUB_OUTPUT"
          echo "Release version $ver from commit ${GITHUB_SHA}"

      - name: Set up bootstrap Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.24.6"
          cache: false

      - name: Build host toolchain
        working-directory: src
        env:
          CGO_ENABLED: "0"
        run: ./make.bash

      - name: Archive host tree
        run: |
          tar --exclude .git -czf "${{ runner.temp }}/host-toolchain.tar.gz" .
          ls -lh "${{ runner.temp }}/host-toolchain.tar.gz"

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: host-toolchain
          path: ${{ runner.temp }}/host-toolchain.tar.gz
          retention-days: 1

  dist:
    name: Package ${{ matrix.target }}
    needs: host
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        target:
          - windows_amd64
          - windows_arm64
          - windows_386
          - darwin_amd64
          - darwin_arm64
          - linux_amd64
          - linux_arm64
          - linux_arm
          - linux_386
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: host-toolchain
          path: ${{ runner.temp }}

      - name: Unpack host tree
        run: tar -xzf "${{ runner.temp }}/host-toolchain.tar.gz"

      - name: Cross-compile target
        env:
          CGO_ENABLED: "0"
        run: |
          set -euo pipefail
          export GOROOT="$PWD"
          export PATH="$GOROOT/bin:$PATH"
          go version
          target="${{ matrix.target }}"
          goos="${target%%_*}"
          goarch="${target#*_}"
          if [[ "$target" != "linux_amd64" ]]; then
            GOOS="$goos" GOARCH="$goarch" go install std cmd
          fi
          ls -l bin bin/"$target" 2>/dev/null || true

      - name: Package
        run: |
          chmod +x scripts/package-toolchain.sh
          mkdir -p dist
          ./scripts/package-toolchain.sh "${{ matrix.target }}" "${{ needs.host.outputs.version }}" "$PWD/dist"
          ls -lh dist

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dist-${{ matrix.target }}
          path: dist/*
          if-no-files-found: error
          retention-days: 7

  release:
    name: Create draft release
    needs: [host, dist]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: true
          fetch-depth: 0

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: dist-*
          merge-multiple: true
          path: dist

      - name: Publish draft
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ needs.host.outputs.version }}
          GIT_AUTHOR_NAME: github-actions[bot]
          GIT_AUTHOR_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com
          GIT_COMMITTER_NAME: github-actions[bot]
          GIT_COMMITTER_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com
        run: |
          set -euo pipefail
          ls -lh dist
          git config user.name "${GIT_COMMITTER_NAME}"
          git config user.email "${GIT_COMMITTER_EMAIL}"
          git fetch --tags origin
          tag="v${VERSION}"
          if ! git rev-parse "$tag" >/dev/null 2>&1; then
            git tag -a "$tag" -m "go-legacy-winxp-${VERSION}"
            git push origin "$tag"
          fi
          if ! gh release view "$tag" >/dev/null 2>&1; then
            gh release create "$tag" \
              --title "go-legacy-winxp-${VERSION}" \
              --notes "go-legacy-winxp ${VERSION} (commit ${GITHUB_SHA})." \
              --draft \
              --target "${GITHUB_SHA}"
          fi
          gh release upload "$tag" dist/* --clobber
