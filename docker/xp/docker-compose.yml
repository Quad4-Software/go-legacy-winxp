services:
  windows-xp:
    image: dockurr/windows:6.04
    container_name: go-legacy-winxp-test
    privileged: true
    environment:
      VERSION: "xp"
      RAM_SIZE: "2G"
      CPU_CORES: "2"
      CPU_MODEL: "qemu64"
      DISK_SIZE: "8G"
      USERNAME: "docker"
      PASSWORD: "admin"
      HV: "N"
      REMOVE: "N"
      LOG: "Y"
    devices:
      - /dev/kvm
      - /dev/net/tun
    cap_add:
      - NET_ADMIN
    ports:
      - "8006:8006"
    volumes:
      - ${XP_STORAGE:-./storage}:/storage
      - ./oem:/oem
      - ./shared:/shared
      - ./iso/xp-sp3.iso:/custom.iso
    stop_grace_period: 2m
